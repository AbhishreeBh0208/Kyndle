services:
  postgres:
    image: postgres:17
    container_name: kyndle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: kyndle
      POSTGRES_PASSWORD: kyndle_dev_password
      POSTGRES_DB: kyndle

    ports:
      - "5432:5432"

    volumes:
      - kyndle_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyndle -d kyndle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kyndle_postgres_data: